name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run notices
      - run: git diff --exit-code docs/dependency-inventory.json
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Install Electron runtime before timed desktop tests
        run: npm run electron:install
        timeout-minutes: 5
      - run: npm run native:build
      - run: npm run native:check
      - run: npm run build
      - run: npm run test:e2e
        env:
          DEBUG: pw:browser
      - name: Retain self-authored desktop test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-diagnostics
          path: test-results/
          retention-days: 1
