name: Native checks
on: [push, pull_request]
env:
  # Temporary explicit scope for the approved debugging branch's pushes only.
  # After the focused evidence is reviewed, a normal feature-branch commit
  # selects full; other refs and all PRs retain the original full60 path.
  PDFNO_APPROVED_BRANCH_PUSH_UI_SCOPE: full
  # Explicit Mac-first scope for the approved integration and main pushes.
  # Other refs and every PR retain the mobile build; set all to restore it here.
  PDFNO_APPROVED_MAC_PUSH_PLATFORM_SCOPE: mac
  # Authorized diagnosis/full Mac73 on this exact branch; main remains full60.
  PDFNO_APPROVED_SHARED_CONTRACT_SCOPE: mac73
  # Acceptance executes same-binary shared8, gate17, then remaining56.
  PDFNO_MAC73_EXECUTION_SCOPE: gate17
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    # Run 37784399153 exceeded 65m: prechecks/builds plus the full 60-method GUI run took ~69m.
    # Original per-assertion and per-test limits are retained in both scopes.
    # Budget 25m + 35m + 85m UI steps, prechecks/builds and evidence upload on this branch.
    # Main/PR stay at 80m; individual 180/240s test limits are unchanged.
    timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/public-language-reader-20261011' && 170 || 80 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4, 2026-10-03
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4, 2026-10-03
        with:
          node-version: '22'
      - name: Rebuild licensed EPUB, comic, Word, text and ebook resources
        run: |
          npm ci --prefix engine-build --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node --test engine-build/loader.test.mjs
          node --test engine-build/rangy-security.test.mjs
          node --test engine-build/docx.test.mjs
          node engine-build/build.mjs
          node --test engine-build/comics-reader.test.mjs
          node engine-build/build-comics.mjs
          node engine-build/build-docx.mjs
          node engine-build/build-text.mjs
          node --test engine-build/ebook.test.mjs engine-build/ebook-bridge.test.mjs
          node engine-build/build-ebooks.mjs
          python3 -B scripts/generate-ebook-fixtures.py
          python3 -B scripts/generate-cbt-fixture.py
          python3 -B scripts/generate-native-comic-fixtures.py
          python3 scripts/generate-epub-fixture.py
          python3 -B scripts/generate-reader-layout-fixtures.py --check
          python3 scripts/generate-docx-fixture.py
          node engine-build/generate-docx-extraction.mjs
          python3 scripts/generate-original-fixture-inventory.py
          git diff --exit-code -- scripts/ORIGINAL-FIXTURES.json engine-build/EBOOK-BUNDLE-INPUTS.json engine-build/TEXT-BUNDLE-INPUTS.json engine-build/DOCX-BUNDLE-INPUTS.json engine-build/DOCX-BUNDLED-DEPENDENCIES.json engine-build/BUNDLE-INPUTS.json apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/Ebooks apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/TextFormats apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/EPUB apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/Comics apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/DOCX apple/Packages/PDFnoKit/Sources/PDFnoUI/Resources apple/Packages/PDFnoKit/Tests/PDFnoKitTests/Fixtures
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Select explicit GUI scope
        id: ui-scope
        env:
          PDFNO_EVENT: ${{ github.event_name }}
          PDFNO_REF: ${{ github.ref }}
        run: |
          if [ "$PDFNO_EVENT" = push ] && [ "$PDFNO_REF" = refs/heads/fix/public-language-reader-20261011 ]; then
            case "$PDFNO_APPROVED_SHARED_CONTRACT_SCOPE" in shared8|mac73) mode="$PDFNO_APPROVED_SHARED_CONTRACT_SCOPE" ;; *) exit 1 ;; esac
            if [ "$mode" = mac73 ]; then
              case "$PDFNO_MAC73_EXECUTION_SCOPE" in diagnostic6|gate17) ;; *) exit 1 ;; esac
            fi
          elif [ "$PDFNO_EVENT" = push ] && [ "$PDFNO_REF" = refs/heads/feature/mac-reader-viewport-focus-20261008 ]; then
            case "$PDFNO_APPROVED_BRANCH_PUSH_UI_SCOPE" in full|focused) mode="$PDFNO_APPROVED_BRANCH_PUSH_UI_SCOPE" ;; *) exit 1 ;; esac
          else
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Explicit GUI scope: $mode (diagnostic8, focused10, full60 and guarded Mac73 are distinct)"
      - name: Source and original fixture guards
        run: |
          python3 scripts/check-native-source.py
          python3 scripts/check-comic-codecs.py
          python3 -B scripts/test-requirement-ledger.py
          python3 scripts/generate-apple-project.py
          git diff --exit-code -- apple/PDFno.xcodeproj apple/PDFno.xcworkspace apple/Packages/PDFnoKit/Sources/PDFnoUI/Resources apple/Packages/PDFnoKit/Tests/PDFnoKitTests/Fixtures
      - name: Swift source, storage, PDFKit, EPUB and offline AI isolation tests
        run: swift test --package-path apple/Packages/PDFnoKit --scratch-path .build/PDFnoKit --no-parallel
      - name: Native Mac build
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac CODE_SIGNING_ALLOWED=NO build
      - name: Native iPhone and iPad simulator build
        if: >-
          github.event_name != 'push' ||
          (github.ref != 'refs/heads/fix/public-language-reader-20261011' && github.ref != 'refs/heads/main') ||
          env.PDFNO_APPROVED_MAC_PUSH_PLATFORM_SCOPE != 'mac'
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMobile -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/Mobile CODE_SIGNING_ALLOWED=NO build
      - name: Mac PDF, EPUB, CBZ, Word, local export and offline AI consent, citations and restart
        if: steps.ui-scope.outputs.mode == 'full'
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac -resultBundlePath .build/CI-Mac.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test
      - name: Focused original failures and unfinished flows with fixture panel diagnostics
        if: steps.ui-scope.outputs.mode == 'focused'
        timeout-minutes: 45
        run: |
          xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing
          python3 scripts/prepare-native-focused-ui.py --products .build/Mac/Build/Products --output .build/Mac/Build/Products/FocusedDiagnostic10.xctestrun
          set -o pipefail
          xcodebuild -xctestrun .build/Mac/Build/Products/FocusedDiagnostic10.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-Focused.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-Focused.log
      - name: Retain actual focused diagnostic evidence
        if: always() && steps.ui-scope.outputs.mode == 'focused'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4 commit verified 2026-10-08
        with:
          name: native-focused-diagnostic10
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/CI-Focused.xcresult
            .build/CI-Focused.log
            .build/Mac/Build/Products/FocusedDiagnostic10.json
      - name: Eight representative shared-contract regressions with original assertions
        if: steps.ui-scope.outputs.mode == 'shared8'
        timeout-minutes: 35
        run: |
          xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing
          python3 scripts/prepare-native-focused-ui.py --scope shared8 --products .build/Mac/Build/Products --output .build/Mac/Build/Products/SharedContractDiagnostic8.xctestrun
          set -o pipefail
          xcodebuild -xctestrun .build/Mac/Build/Products/SharedContractDiagnostic8.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-Shared8.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-Shared8.log
      - name: Retain actual shared-contract diagnostic evidence
        if: always() && steps.ui-scope.outputs.mode == 'shared8'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-shared-contract-diagnostic8
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/CI-Shared8.xcresult
            .build/CI-Shared8.log
            .build/Mac/Build/Products/SharedContractDiagnostic8.json
      - name: Preflight the dedicated CI display for original wide windows
        if: steps.ui-scope.outputs.mode == 'mac73'
        run: |
          xcrun swiftc qa/mac-ui-regression/CIReadableDisplay.swift -o .build/CIReadableDisplay
          .build/CIReadableDisplay --configure-ci
      - name: Prepare and compile current offline Mac original68 plus new5
        if: steps.ui-scope.outputs.mode == 'mac73'
        run: |
          python3 -B qa/mac-ui-regression/prepare.py --output .build/MacFullQA
          xcodebuild -project .build/MacFullQA/source/apple/PDFno.xcodeproj -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/MacFullQA/DerivedData -jobs 1 -disableAutomaticPackageResolution -skipPackageUpdates build-for-testing CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO CODE_SIGN_ENTITLEMENTS=
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope shared8
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope gate17
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope remaining56
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope diagnostic6
      - name: Six original Mac73 failures with bounded own-window AX evidence
        if: steps.ui-scope.outputs.mode == 'mac73' && env.PDFNO_MAC73_EXECUTION_SCOPE == 'diagnostic6'
        timeout-minutes: 20
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-diagnostic6.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-Diagnostic6.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-Diagnostic6.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope diagnostic6 --result .build/CI-Diagnostic6.xcresult --log .build/CI-Diagnostic6.log --exit-code "$test_code"
          exit "$test_code"
      - name: Eight representative regressions before the current Mac17 gate
        if: steps.ui-scope.outputs.mode == 'mac73' && env.PDFNO_MAC73_EXECUTION_SCOPE == 'gate17'
        timeout-minutes: 25
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-shared8.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-Mac73Shared8.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-Mac73Shared8.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope shared8 --result .build/CI-Mac73Shared8.xcresult --log .build/CI-Mac73Shared8.log --exit-code "$test_code"
          exit "$test_code"
      - name: Original12 gate and new5 on the same current Mac candidate
        if: steps.ui-scope.outputs.mode == 'mac73' && env.PDFNO_MAC73_EXECUTION_SCOPE == 'gate17'
        timeout-minutes: 35
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-gate17.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-Gate17.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-Gate17.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope gate17 --result .build/CI-Gate17.xcresult --log .build/CI-Gate17.log --exit-code "$test_code"
          exit "$test_code"
      - name: Remaining56 original Mac regressions after accepted gate17
        if: steps.ui-scope.outputs.mode == 'mac73' && env.PDFNO_MAC73_EXECUTION_SCOPE == 'gate17'
        timeout-minutes: 85
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-remaining56.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-Remaining56.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-Remaining56.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope remaining56 --result .build/CI-Remaining56.xcresult --log .build/CI-Remaining56.log --exit-code "$test_code"
          exit "$test_code"
      - name: Keep official Mac73 results and original failures
        if: always() && steps.ui-scope.outputs.mode == 'mac73'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-current-mac73
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/CI-Mac73-Display.json
            .build/CI-Mac73Shared8.xcresult
            .build/CI-Mac73Shared8.log
            .build/CI-Diagnostic6.xcresult
            .build/CI-Diagnostic6.log
            .build/CI-Gate17.xcresult
            .build/CI-Gate17.log
            .build/CI-Remaining56.xcresult
            .build/CI-Remaining56.log
            .build/MacFullQA/PREPARATION.json
            .build/MacFullQA/PLAN-*.json
            .build/MacFullQA/Evidence
            .build/MacFullQA/Diagnostics
            .build/MacFullQA/Registry/window-geometry-*.json
      - name: Record actual full-regression commit
        if: always() && steps.ui-scope.outputs.mode == 'full'
        run: git rev-parse HEAD > .build/CI-Mac-SHA.txt
      - name: Retain actual full-regression evidence
        if: always() && steps.ui-scope.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same verified official v4
        with:
          name: native-original-full60
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/CI-Mac.xcresult
            .build/CI-Mac-SHA.txt
