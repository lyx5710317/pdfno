name: Native checks
on: [push, pull_request]
env:
  # User Sentinel_16e90e990010819186595583a4bde414 paused BYOK validation.
  # Compile its implementation, but execute only the explicit non-BYOK scope.
  PDFNO_APPROVED_MAC_PUSH_PLATFORM_SCOPE: mac
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    # Same original 180/240s per-method limits; allow builds and all retained55.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4, 2026-10-03
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4, 2026-10-03
        with:
          node-version: '22'
      - name: Rebuild licensed EPUB, comic, Word, text and ebook resources
        run: |
          npm ci --prefix engine-build --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node --test engine-build/loader.test.mjs
          node --test engine-build/rangy-security.test.mjs
          node --test engine-build/docx.test.mjs
          node engine-build/build.mjs
          node --test engine-build/comics-reader.test.mjs
          node engine-build/build-comics.mjs
          node engine-build/build-docx.mjs
          node engine-build/build-text.mjs
          node --test engine-build/ebook.test.mjs engine-build/ebook-bridge.test.mjs
          node engine-build/build-ebooks.mjs
          python3 -B scripts/generate-ebook-fixtures.py
          python3 -B scripts/generate-cbt-fixture.py
          python3 -B scripts/generate-native-comic-fixtures.py
          python3 scripts/generate-epub-fixture.py
          python3 -B scripts/generate-reader-layout-fixtures.py --check
          python3 scripts/generate-docx-fixture.py
          node engine-build/generate-docx-extraction.mjs
          python3 scripts/generate-original-fixture-inventory.py
          git diff --exit-code -- scripts/ORIGINAL-FIXTURES.json engine-build/EBOOK-BUNDLE-INPUTS.json engine-build/TEXT-BUNDLE-INPUTS.json engine-build/DOCX-BUNDLE-INPUTS.json engine-build/DOCX-BUNDLED-DEPENDENCIES.json engine-build/BUNDLE-INPUTS.json apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/Ebooks apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/TextFormats apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/EPUB apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/Comics apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/DOCX apple/Packages/PDFnoKit/Sources/PDFnoUI/Resources apple/Packages/PDFnoKit/Tests/PDFnoKitTests/Fixtures
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate the explicit user-approved non-BYOK scope
        run: python3 -B qa/mac-ui-regression/nonbyok_scope.py
      - name: Source and original fixture guards
        run: |
          python3 scripts/check-native-source.py
          python3 scripts/check-comic-codecs.py
          python3 -B scripts/test-requirement-ledger.py
          python3 scripts/generate-apple-project.py
          git diff --exit-code -- apple/PDFno.xcodeproj apple/PDFno.xcworkspace apple/Packages/PDFnoKit/Sources/PDFnoUI/Resources apple/Packages/PDFnoKit/Tests/PDFnoKitTests/Fixtures
      - name: Explicit retained591 Swift checks; excluded109 are not accepted
        run: python3 -B qa/mac-ui-regression/run-swift-nonbyok.py --scratch .build/PDFnoKit --output .build/SwiftNonBYOK
      - name: Native Mac build
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac CODE_SIGNING_ALLOWED=NO build
      - name: Native iPhone and iPad simulator build
        if: >-
          github.event_name != 'push' ||
          (github.ref != 'refs/heads/fix/public-language-reader-20261011' && github.ref != 'refs/heads/main') ||
          env.PDFNO_APPROVED_MAC_PUSH_PLATFORM_SCOPE != 'mac'
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMobile -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/Mobile CODE_SIGNING_ALLOWED=NO build
      - name: Preflight the dedicated CI display for original wide windows
        run: |
          xcrun swiftc qa/mac-ui-regression/CIReadableDisplay.swift -o .build/CIReadableDisplay
          .build/CIReadableDisplay --configure-ci
      - name: Compile all original73; configure retained55 non-BYOK GUI methods
        run: |
          python3 -B qa/mac-ui-regression/prepare.py --scope nonbyok --output .build/MacFullQA
          xcodebuild -project .build/MacFullQA/source/apple/PDFno.xcodeproj -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/MacFullQA/DerivedData -jobs 1 -disableAutomaticPackageResolution -skipPackageUpdates build-for-testing CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO CODE_SIGN_ENTITLEMENTS=
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope representative6
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope nonbyok-gate17
          python3 -B qa/mac-ui-regression/configure.py --qa .build/MacFullQA --scope remaining38
      - name: Six retained representative regressions before the current Mac17 gate
        timeout-minutes: 25
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-representative6.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-NonBYOKRepresentative6.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-NonBYOKRepresentative6.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope representative6 --result .build/CI-NonBYOKRepresentative6.xcresult --log .build/CI-NonBYOKRepresentative6.log --exit-code "$test_code"
          exit "$test_code"
      - name: Original12 gate plus five retained local-Mock GUI scenarios
        timeout-minutes: 35
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-nonbyok-gate17.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-NonBYOKGate17.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-NonBYOKGate17.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope nonbyok-gate17 --result .build/CI-NonBYOKGate17.xcresult --log .build/CI-NonBYOKGate17.log --exit-code "$test_code"
          exit "$test_code"
      - name: Remaining38 retained regressions after accepted non-BYOK gate17
        timeout-minutes: 85
        run: |
          set -o pipefail
          set +e
          xcodebuild -xctestrun .build/MacFullQA/DerivedData/Build/Products/QA-remaining38.xctestrun -destination 'platform=macOS' -resultBundlePath .build/CI-NonBYOKRemaining38.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee .build/CI-NonBYOKRemaining38.log
          test_code=${PIPESTATUS[0]}
          set -e
          python3 -B qa/mac-ui-regression/verify-result.py --qa .build/MacFullQA --scope remaining38 --result .build/CI-NonBYOKRemaining38.xcresult --log .build/CI-NonBYOKRemaining38.log --exit-code "$test_code"
          exit "$test_code"
      - name: Keep exact non-BYOK results and user-excluded failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-current-mac-nonbyok55
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/CI-Mac73-Display.json
            .build/CI-NonBYOKRepresentative6.xcresult
            .build/CI-NonBYOKRepresentative6.log
            .build/CI-NonBYOKGate17.xcresult
            .build/CI-NonBYOKGate17.log
            .build/CI-NonBYOKRemaining38.xcresult
            .build/CI-NonBYOKRemaining38.log
            .build/SwiftNonBYOK
            .build/MacFullQA/PREPARATION.json
            .build/MacFullQA/PLAN-*.json
            .build/MacFullQA/Evidence
            .build/MacFullQA/Diagnostics
            .build/MacFullQA/Registry/window-geometry-*.json
            qa/mac-ui-regression/nonbyok-scope.json
      - name: Keep small official exports and exact product/result bindings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-current-mac-nonbyok55-verifications
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/SwiftNonBYOK/VERIFICATION.json
            .build/SwiftNonBYOK/swift-testing.xml
            .build/SwiftNonBYOK/swift.log
            .build/MacFullQA/PREPARATION.json
            .build/MacFullQA/PLAN-*.json
            .build/MacFullQA/Evidence/*-verification.json
            .build/MacFullQA/Evidence/*-official-summary.json
            .build/MacFullQA/Evidence/*-official-tests.json
            .build/CI-NonBYOKRepresentative6.log
            .build/CI-NonBYOKGate17.log
            .build/CI-NonBYOKRemaining38.log
            .build/CI-Mac73-Display.json
            qa/mac-ui-regression/nonbyok-scope.json
