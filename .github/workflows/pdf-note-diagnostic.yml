name: Temporary PDF layout accessibility comparison
on:
  push:
    branches: [feature/integration-ui-data-english-20261005]
    paths: [.github/workflows/pdf-note-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify original committed sources
        run: |
          python3 scripts/check-native-source.py
          python3 scripts/generate-apple-project.py
          git diff --exit-code -- apple
      - name: Inject temporary synthetic layout probes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shell = Path('apple/Packages/PDFnoKit/Sources/PDFnoUI/PDFnoReaderShell.swift')
          source = shell.read_text().replace('.zIndex(2)', '.zIndex(2).accessibilitySortPriority(ProcessInfo.processInfo.environment["PDFNO_HIT_SORT"] == "top" ? 10 : 0)')
          shell.write_text(source)
          design = Path('apple/Packages/PDFnoKit/Sources/PDFnoUI/PDFnoDesignSystem.swift')
          source = design.read_text().replace('.accessibilityElement(children: .contain)', '.modifier(SyntheticPanelAXMode())')
          source += '''
          private struct SyntheticPanelAXMode: ViewModifier {
              @ViewBuilder func body(content: Content) -> some View {
                  if ProcessInfo.processInfo.environment["PDFNO_HIT_CONTAIN"] == "flat" { content }
                  else { content.accessibilityElement(children: .contain) }
              }
          }
          '''
          design.write_text(source)
          composer = Path('apple/Packages/PDFnoKit/Sources/PDFnoUI/PDFNoteComposer.swift')
          source = composer.read_text().replace('}.padding(PDFnoDesign.Space.regular).frame(maxWidth: .infinity, alignment: .leading)', '}.padding(PDFnoDesign.Space.regular).frame(maxWidth: .infinity, alignment: .leading).onAppear { syntheticPanelHitProbe() }')
          source += '''
          #if os(macOS)
          @MainActor private func syntheticPanelHitProbe() {
              guard let token = ProcessInfo.processInfo.environment["PDFNO_UI_TEST_SESSION"], UUID(uuidString: token) != nil,
                    let width = Double(ProcessInfo.processInfo.environment["PDFNO_HIT_WIDTH"] ?? ""), let window = NSApp.mainWindow else { return }
              var frame = window.frame; frame.size.width = width
              if let screen = window.screen { frame.origin.x = min(frame.minX, screen.visibleFrame.maxX - width) }
              window.setFrame(frame, display: true)
              DispatchQueue.main.asyncAfter(deadline: .now() + 1) {
                  guard let content = window.contentView else { return }
                  @MainActor func allViews(_ view: NSView) -> [NSView] { [view] + view.subviews.flatMap { allViews($0) } }
                  @MainActor func describe(_ object: NSObject?) -> String {
                      guard let object else { return "nil" }
                      let getter = #selector(NSAccessibilityProtocol.accessibilityIdentifier)
                      let identifier = object.responds(to: getter) ? object.perform(getter)?.takeUnretainedValue() as? String : nil
                      return "type=\\(type(of: object)) role=\\(String(describing: object.accessibilityAttributeValue(.role))) id=\\(String(describing: identifier))"
                  }
                  guard let field = allViews(content).compactMap({ $0 as? NSTextField }).first(where: { $0.placeholderString == "写下你的笔记（可选）" }) else { return }
                  let center = field.convert(NSPoint(x: field.bounds.midX, y: field.bounds.midY), to: nil)
                  let screen = window.convertPoint(toScreen: center)
                  let appHit = NSApp.accessibilityHitTest(screen) as? NSObject
                  let windowHit = window.accessibilityHitTest(screen) as? NSObject
                  let contentHit = content.accessibilityHitTest(screen) as? NSObject
                  let result: [String: Any] = ["windowWidth": window.frame.width, "fieldFrame": String(describing: field.frame),
                      "fieldCell": describe(field.cell), "appHit": describe(appHit), "windowHit": describe(windowHit), "contentHit": describe(contentHit),
                      "appHitIsCell": appHit === field.cell, "windowHitIsCell": windowHit === field.cell, "contentHitIsCell": contentHit === field.cell,
                      "hidden": field.isHiddenOrHasHiddenAncestor]
                  let path = URL(fileURLWithPath: "/tmp/PDFno-UITests-" + token).appendingPathComponent("hit-diagnostic.json")
                  try? JSONSerialization.data(withJSONObject: result, options: .sortedKeys).write(to: path)
              }
          }
          #endif
          '''
          composer.write_text(source)
          PY
      - name: Append diagnostic test without changing original tests in git
        run: |
          cat >> apple/Tests/NativeUITests.swift <<'SWIFT'
          #if os(macOS)
          extension NativeUITests {
              @MainActor func testPDFLayoutHitComparison() throws {
                  for (name, width, sort, contain) in [("base", "1000", "default", "contain"), ("sort", "1000", "top", "contain"), ("wide", "1012", "default", "contain"), ("flat", "1000", "default", "flat")] {
                      let app = XCUIApplication(), token = UUID().uuidString
                      app.launchEnvironment["PDFNO_UI_TEST_SESSION"] = token
                      app.launchEnvironment["PDFNO_HIT_WIDTH"] = width
                      app.launchEnvironment["PDFNO_HIT_SORT"] = sort
                      app.launchEnvironment["PDFNO_HIT_CONTAIN"] = contain
                      app.launch(); app.activate()
                      try prepareOriginalPDFNoteEditing(app)
                      press(app.buttons["reader-notes"].firstMatch)
                      let input = japaneseElement("note-input", in: app)
                      XCTAssertTrue(input.waitForExistence(timeout: 5))
                      let probe = URL(fileURLWithPath: "/tmp/PDFno-UITests-" + token).appendingPathComponent("hit-diagnostic.json")
                      let ready = expectation(for: NSPredicate { _, _ in FileManager.default.fileExists(atPath: probe.path) }, evaluatedWith: app)
                      wait(for: [ready], timeout: 5)
                      let data = try Data(contentsOf: probe)
                      print("SYNTHETIC LAYOUT \(name) enabled=\(input.isEnabled) hittable=\(input.isHittable) frame=\(input.frame) saveHittable=\(app.buttons["save-note"].firstMatch.isHittable)")
                      print("SYNTHETIC ROOT HIT \(name): \(String(decoding: data, as: UTF8.self))")
                      print("SYNTHETIC TREE \(name): \(app.debugDescription)")
                      let screenshot = XCTAttachment(screenshot: app.screenshot()); screenshot.name = "Synthetic " + name; screenshot.lifetime = .keepAlways; add(screenshot)
                      if input.isHittable { input.click() }
                      else { input.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).click() }
                      input.typeText("Original diagnostic draft")
                      print("SYNTHETIC VALUE \(name): \(String(describing: input.value))")
                      app.terminate()
                  }
              }
          }
          #endif
          SWIFT
      - name: Run isolated synthetic comparison
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac -resultBundlePath .build/PDFLayoutDiagnostic.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 -only-testing:PDFnoMacUITests/NativeUITests/testPDFLayoutHitComparison test
      - name: Archive synthetic diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pdf-layout-diagnostic-${{ github.sha }}
          path: .build/PDFLayoutDiagnostic.xcresult
          retention-days: 7
