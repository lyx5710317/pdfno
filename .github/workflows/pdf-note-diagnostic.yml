name: Temporary PDF note hit diagnostics
on:
  workflow_dispatch:
  push:
    branches: [feature/integration-ui-data-english-20261005]
    paths: [.github/workflows/pdf-note-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate unchanged original project
        run: |
          python3 scripts/check-native-source.py
          python3 scripts/generate-apple-project.py
          git diff --exit-code -- apple
      - name: Inject temporary app hit-path probe in synthetic runner build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apple/Packages/PDFnoKit/Sources/PDFnoUI/PDFNoteComposer.swift')
          source = path.read_text().replace('}.padding(PDFnoDesign.Space.regular).frame(maxWidth: .infinity, alignment: .leading)', '}.padding(PDFnoDesign.Space.regular).frame(maxWidth: .infinity, alignment: .leading).onAppear { dumpSyntheticPDFNotes() }')
          source += '''
          #if os(macOS)
          import AppKit
          @MainActor private func dumpSyntheticPDFNotes() {
              guard let token = ProcessInfo.processInfo.environment["PDFNO_UI_TEST_SESSION"], UUID(uuidString: token) != nil else { return }
              DispatchQueue.main.asyncAfter(deadline: .now() + 1) {
                  guard let window = NSApp.mainWindow, let content = window.contentView else { return }
                  func allViews(_ view: NSView) -> [NSView] { [view] + view.subviews.flatMap { allViews($0) } }
                  func describe(_ object: NSObject?) -> String {
                      guard let object else { return "nil" }
                      return "type=\\(type(of: object)) role=\\(String(describing: object.accessibilityAttributeValue(.role))) id=\\(String(describing: object.accessibilityAttributeValue(.identifier)))"
                  }
                  let views = allViews(content)
                  var lines = views.map { "type=\\(type(of: $0)) frame=\\($0.frame) bounds=\\($0.bounds) hidden=\\($0.isHidden)" }
                  for view in views {
                      let field = view as? NSTextField
                      guard field?.placeholderString == "写下你的笔记（可选）" else { continue }
                      let center = view.convert(NSPoint(x: view.bounds.midX, y: view.bounds.midY), to: nil)
                      let screen = window.convertPoint(toScreen: center)
                      lines.append("INPUT screen=\\(screen) physical=\\(describe(content.hitTest(content.superview!.convert(center, from: nil))))")
                      lines.append("WINDOW AX HIT \\(describe(window.accessibilityHitTest(screen) as? NSObject))")
                      lines.append("CONTENT AX HIT \\(describe(content.accessibilityHitTest(screen) as? NSObject))")
                  }
                  let path = URL(fileURLWithPath: "/tmp/PDFno-UITests-" + token).appendingPathComponent("hit-diagnostic.json")
                  try? JSONSerialization.data(withJSONObject: lines).write(to: path)
              }
          }
          #endif
          '''
          path.write_text(source)
          PY
      - name: Append temporary synthetic diagnostic to runner only
        run: |
          cat >> apple/Tests/NativeUITests.swift <<'SWIFT'
          #if os(macOS)
          extension NativeUITests {
              @MainActor func testPDFNoteInputHitDiagnostics() throws {
                  let app = XCUIApplication(), token = UUID().uuidString
                  app.launchEnvironment["PDFNO_UI_TEST_SESSION"] = token
                  app.launch(); app.activate(); defer { app.terminate() }
                  try prepareOriginalPDFNoteEditing(app)
                  press(app.buttons["reader-notes"].firstMatch)
                  let input = japaneseElement("note-input", in: app)
                  XCTAssertTrue(input.waitForExistence(timeout: 5))
                  print("SYNTHETIC PDF INPUT enabled=\(input.isEnabled) hittable=\(input.isHittable) frame=\(input.frame)")
                  print("SYNTHETIC PDF APP TREE: \(app.debugDescription)")
                  let hitPath = URL(fileURLWithPath: "/tmp/PDFno-UITests-" + token).appendingPathComponent("hit-diagnostic.json")
                  if let data = try? Data(contentsOf: hitPath), let lines = try? JSONSerialization.jsonObject(with: data) { print("SYNTHETIC IN-PROCESS PATHS: \(lines)") }
                  let screenshot = XCTAttachment(screenshot: app.screenshot())
                  screenshot.name = "Synthetic PDF before hit"; screenshot.lifetime = .keepAlways; add(screenshot)
                  let processes = NSRunningApplication.runningApplications(withBundleIdentifier: "org.pdfno.PDFnoMac")
                  XCTAssertEqual(processes.count, 1)
                  if let process = processes.first {
                      let root = AXUIElementCreateApplication(process.processIdentifier)
                      var hit: AXUIElement?
                      let frame = input.frame
                      let result = AXUIElementCopyElementAtPosition(root, Float(frame.midX), Float(frame.midY), &hit)
                      print("SYNTHETIC PDF EXTERNAL HIT result=\(result.rawValue)")
                      if let hit {
                          for attribute in [kAXRoleAttribute, kAXIdentifierAttribute, kAXDescriptionAttribute, kAXPositionAttribute, kAXSizeAttribute] {
                              var value: CFTypeRef?
                              let status = AXUIElementCopyAttributeValue(hit, attribute as CFString, &value)
                              print("SYNTHETIC PDF HIT \(attribute)=\(String(describing: value)) status=\(status.rawValue)")
                          }
                      }
                  }
                  // Diagnostic physical click only; never used for acceptance.
                  input.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).click()
                  input.typeText("Original diagnostic draft")
                  print("SYNTHETIC PDF AFTER PHYSICAL CLICK value=\(String(describing: input.value)) enabled=\(input.isEnabled) hittable=\(input.isHittable)")
                  let after = XCTAttachment(screenshot: app.screenshot())
                  after.name = "Synthetic PDF after hit"; after.lifetime = .keepAlways; add(after)
              }
          }
          #endif
          SWIFT
      - name: Run temporary isolated diagnostic
        run: xcodebuild -workspace apple/PDFno.xcworkspace -scheme PDFnoMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/Mac -resultBundlePath .build/PDFNoteDiagnostic.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 -only-testing:PDFnoMacUITests/NativeUITests/testPDFNoteInputHitDiagnostics test
      - name: Archive synthetic diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pdf-note-diagnostic-${{ github.sha }}
          path: .build/PDFNoteDiagnostic.xcresult
          retention-days: 7
