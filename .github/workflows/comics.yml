name: CBZ comic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  comics:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4, 2026-10-03
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4, 2026-10-03
        with:
          node-version: '22'
      - name: Reproduce verified Kookit comic profile without package installation
        run: |
          node engine-build/build-comics.mjs
          git diff --exit-code -- apple/Packages/PDFnoKit/Sources/PDFnoReaders/Resources/Comics
          node --test engine-build/comics-reader.test.mjs
      - name: Original comic archive, image, ordering and persistence tests
        run: swift test --package-path apple/Packages/PDFnoKit --scratch-path .build/Comics --filter ComicTests
